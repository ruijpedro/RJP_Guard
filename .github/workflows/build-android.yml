name: Build RJP Guard APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

env:
  RJP_KEYSTORE_BASE64: ${{ secrets.RJP_KEYSTORE_BASE64 }}
  RJP_KEYSTORE_PASSWORD: ${{ secrets.RJP_KEYSTORE_PASSWORD }}
  RJP_KEY_ALIAS: ${{ secrets.RJP_KEY_ALIAS }}
  RJP_KEY_PASSWORD: ${{ secrets.RJP_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Guard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare permanent release keystore
        if: env.RJP_KEYSTORE_BASE64 != ''
        run: |
          echo "$RJP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rjp-guard-release.jks"
          echo "RJP_KEYSTORE_PATH=$RUNNER_TEMP/rjp-guard-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.RJP_KEYSTORE_BASE64 != ''
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: env.RJP_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Guard-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
