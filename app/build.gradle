plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.rjp.guard'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.rjp.guard'
        minSdk 29
        targetSdk 35
        versionCode 41
        versionName '4.0.0'
    }

    def releaseKeystorePath = System.getenv("RJP_KEYSTORE_PATH")
    def releaseKeystorePassword = System.getenv("RJP_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("RJP_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("RJP_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
